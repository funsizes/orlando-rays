<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Orlando Rays — Liga Amistosa schedule, results, standings and player stats" />
  <meta name="theme-color" content="#0b1a2e" />
  <title>Orlando Rays</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚾</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand" href="#home">
      <span class="brand-mark">R</span>
      <span class="brand-text">
        <span id="brand-name" class="brand-name">Orlando Rays</span>
        <span id="brand-sub" class="brand-sub">Liga Amistosa</span>
      </span>
    </a>
    <nav>
      <a href="#home"      data-nav="home"><i class="fas fa-house"></i><span>Home</span></a>
      <a href="#schedule"  data-nav="schedule"><i class="fas fa-calendar-days"></i><span>Schedule</span></a>
      <a href="#standings" data-nav="standings"><i class="fas fa-ranking-star"></i><span>Standings</span></a>
      <a href="#stats"     data-nav="stats"><i class="fas fa-chart-simple"></i><span>Stats</span></a>
      <a href="#roster"    data-nav="roster"><i class="fas fa-users"></i><span>Roster</span></a>
      <a href="#rules"     data-nav="rules"><i class="fas fa-scale-balanced"></i><span>Rules</span></a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer id="footer"></footer>

<!-- Load data/app with a fresh query string so weekly updates show up right away (Pages caches ~10 min) -->
<script>
  (function () {
    var v = Date.now();
    document.write('<script src="data.js?v=' + v + '"><\/script><script src="app.js?v=' + v + '"><\/script>');
  })();
</script>
</body>
</html>
